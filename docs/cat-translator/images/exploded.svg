<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <rect x="0" y="0" width="960" height="700" fill="#ffffff"/>
  <text x="480" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#1f2937">喵语通 MeowTalk Pro · 爆炸装配图（实时语音版）</text>
  <text x="480" y="58" text-anchor="middle" font-size="12" fill="#6b7280">自上而下装配 · 4 颗 M2×10 自攻螺丝锁合 · 外壳 3D 打印（PETG 或树脂）</text>

  <defs>
    <marker id="arr2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#9ca3af"/>
    </marker>
  </defs>

  <!-- 装配中心虚线 -->
  <line x1="400" y1="80" x2="400" y2="660" stroke="#d1d5db" stroke-width="1.5" stroke-dasharray="8 6"/>

  <!-- ① 上盖 -->
  <g>
    <path d="M 280 108 Q 400 82 520 108 L 520 140 L 280 140 Z" fill="#e5e7eb" stroke="#374151" stroke-width="2.5"/>
    <circle cx="400" cy="100" r="8" fill="none" stroke="#f59e0b" stroke-width="3"/>
    <g fill="#374151">
      <circle cx="376" cy="120" r="2.2"/>
      <circle cx="390" cy="120" r="2.2"/>
      <circle cx="404" cy="120" r="2.2"/>
      <circle cx="418" cy="120" r="2.2"/>
    </g>
    <g stroke="#374151" stroke-width="2.5" stroke-linecap="round">
      <line x1="360" y1="131" x2="440" y2="131"/>
    </g>
    <line x1="520" y1="118" x2="620" y2="110" stroke="#9ca3af" stroke-width="1" marker-end="url(#arr2)"/>
    <text x="628" y="106" font-size="13" font-weight="bold" fill="#374151">① 上盖</text>
    <text x="628" y="124" font-size="11" fill="#6b7280">LED 导光柱 + 麦克风透声孔 + 扬声器栅格</text>
    <text x="628" y="140" font-size="11" fill="#6b7280">（内贴 ePTFE 防水透声膜 × 2）</text>
  </g>

  <!-- ② 防水圈 -->
  <g>
    <rect x="300" y="180" width="200" height="14" rx="7" fill="#93c5fd" stroke="#2563eb" stroke-width="2"/>
    <line x1="500" y1="187" x2="620" y2="187" stroke="#9ca3af" stroke-width="1" marker-end="url(#arr2)"/>
    <text x="628" y="184" font-size="13" font-weight="bold" fill="#374151">② 硅胶防水密封圈</text>
    <text x="628" y="202" font-size="11" fill="#6b7280">整机达到 IPX4 防泼溅</text>
  </g>

  <!-- ③ 扬声器 -->
  <g>
    <ellipse cx="400" cy="242" rx="46" ry="16" fill="#fed7aa" stroke="#ea580c" stroke-width="2.5"/>
    <ellipse cx="400" cy="242" rx="26" ry="9" fill="none" stroke="#ea580c" stroke-width="1.5"/>
    <line x1="446" y1="242" x2="620" y2="240" stroke="#9ca3af" stroke-width="1" marker-end="url(#arr2)"/>
    <text x="628" y="236" font-size="13" font-weight="bold" fill="#374151">③ 微型扬声器（Φ15 mm 8Ω 1W）</text>
    <text x="628" y="254" font-size="11" fill="#6b7280">振膜朝上对准上盖栅格，硅胶圈减振固定，</text>
    <text x="628" y="270" font-size="11" fill="#6b7280">导线焊到 PCB 功放输出焊盘</text>
  </g>

  <!-- ④ PCB -->
  <g>
    <rect x="275" y="304" width="250" height="74" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
    <rect x="292" y="318" width="76" height="46" rx="4" fill="#86efac" stroke="#16a34a" stroke-width="1.5"/>
    <text x="330" y="345" text-anchor="middle" font-size="10" fill="#14532d">ESP32-S3</text>
    <rect x="382" y="318" width="34" height="20" rx="3" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.5"/>
    <text x="399" y="332" text-anchor="middle" font-size="8" fill="#14532d">麦克风</text>
    <rect x="382" y="344" width="34" height="20" rx="3" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.5"/>
    <text x="399" y="358" text-anchor="middle" font-size="8" fill="#14532d">IMU</text>
    <rect x="428" y="318" width="42" height="20" rx="3" fill="#fdba74" stroke="#ea580c" stroke-width="1.5"/>
    <text x="449" y="332" text-anchor="middle" font-size="8" fill="#7c2d12">功放98357</text>
    <rect x="428" y="344" width="42" height="20" rx="3" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.5"/>
    <text x="449" y="358" text-anchor="middle" font-size="8" fill="#14532d">TP4056+C</text>
    <rect x="480" y="318" width="36" height="46" rx="3" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.5"/>
    <text x="498" y="338" text-anchor="middle" font-size="8" fill="#14532d">LDO</text>
    <text x="498" y="352" text-anchor="middle" font-size="8" fill="#14532d">按键</text>
    <line x1="525" y1="341" x2="620" y2="330" stroke="#9ca3af" stroke-width="1" marker-end="url(#arr2)"/>
    <text x="628" y="326" font-size="13" font-weight="bold" fill="#374151">④ PCB 主板（40×30 mm）</text>
    <text x="628" y="344" font-size="11" fill="#6b7280">两层板，元件单面贴装；</text>
    <text x="628" y="360" font-size="11" fill="#6b7280">麦克风孔与功放焊盘朝上盖侧</text>
  </g>

  <!-- ⑤ 电池 -->
  <g>
    <rect x="308" y="418" width="184" height="46" rx="8" fill="#fecaca" stroke="#dc2626" stroke-width="2.5"/>
    <text x="400" y="445" text-anchor="middle" font-size="12" fill="#7f1d1d">3.7V 300mAh 锂聚合物</text>
    <line x1="492" y1="441" x2="620" y2="436" stroke="#9ca3af" stroke-width="1" marker-end="url(#arr2)"/>
    <text x="628" y="432" font-size="13" font-weight="bold" fill="#374151">⑤ 电池（502530，约 6g）</text>
    <text x="628" y="450" font-size="11" fill="#6b7280">带保护板，双面胶固定在下盖，</text>
    <text x="628" y="466" font-size="11" fill="#6b7280">与 PCB 之间垫 EVA 泡棉隔离</text>
  </g>

  <!-- ⑥ 下盖 -->
  <g>
    <path d="M 280 508 L 520 508 L 520 538 Q 400 564 280 538 Z" fill="#e5e7eb" stroke="#374151" stroke-width="2.5"/>
    <g fill="#9ca3af">
      <circle cx="296" cy="520" r="4"/>
      <circle cx="504" cy="520" r="4"/>
    </g>
    <rect x="330" y="548" width="140" height="12" rx="6" fill="#ffffff" stroke="#374151" stroke-width="2"/>
    <line x1="520" y1="524" x2="620" y2="520" stroke="#9ca3af" stroke-width="1" marker-end="url(#arr2)"/>
    <text x="628" y="516" font-size="13" font-weight="bold" fill="#374151">⑥ 下盖</text>
    <text x="628" y="534" font-size="11" fill="#6b7280">背面弧形贴合猫脖曲线，</text>
    <text x="628" y="550" font-size="11" fill="#6b7280">带项圈穿带槽 + 4 个螺丝柱</text>
  </g>

  <!-- ⑦ 项圈 -->
  <g>
    <path d="M 250 624 Q 400 592 550 624" fill="none" stroke="#c4a484" stroke-width="14" stroke-linecap="round"/>
    <rect x="530" y="610" width="24" height="26" rx="6" fill="#8b6f47" stroke="#5c4a30" stroke-width="2"/>
    <line x1="554" y1="622" x2="620" y2="616" stroke="#9ca3af" stroke-width="1" marker-end="url(#arr2)"/>
    <text x="628" y="612" font-size="13" font-weight="bold" fill="#374151">⑦ 猫用安全项圈（10 mm 织带）</text>
    <text x="628" y="630" font-size="11" fill="#6b7280">必须选安全断开扣（breakaway）：</text>
    <text x="628" y="646" font-size="11" fill="#6b7280">猫被树枝/栅栏卡住时项圈自动脱开</text>
  </g>

  <text x="480" y="682" text-anchor="middle" font-size="11" fill="#9ca3af">所有外露边缘做 R2 以上圆角；总重目标（主机+项圈）≤ 35 g，适合 3.5 kg 以上成年猫，幼猫不建议佩戴</text>
</svg>
