<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <rect x="0" y="0" width="960" height="640" fill="#ffffff"/>
  <text x="480" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#1f2937">喵语通 MeowTalk · 爆炸装配图</text>
  <text x="480" y="58" text-anchor="middle" font-size="12" fill="#6b7280">自上而下装配 · 4 颗 M2×8 自攻螺丝锁合 · 外壳 3D 打印（PETG 或树脂）</text>

  <defs>
    <marker id="arr2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#9ca3af"/>
    </marker>
  </defs>

  <!-- 装配中心虚线 -->
  <line x1="400" y1="80" x2="400" y2="600" stroke="#d1d5db" stroke-width="1.5" stroke-dasharray="8 6"/>

  <!-- ① 上盖 -->
  <g>
    <path d="M 280 110 Q 400 84 520 110 L 520 140 L 280 140 Z" fill="#e5e7eb" stroke="#374151" stroke-width="2.5"/>
    <circle cx="400" cy="103" r="9" fill="none" stroke="#f59e0b" stroke-width="3"/>
    <g fill="#374151">
      <circle cx="368" cy="126" r="2.5"/>
      <circle cx="384" cy="126" r="2.5"/>
      <circle cx="400" cy="126" r="2.5"/>
      <circle cx="416" cy="126" r="2.5"/>
      <circle cx="432" cy="126" r="2.5"/>
    </g>
    <line x1="520" y1="120" x2="620" y2="112" stroke="#9ca3af" stroke-width="1" marker-end="url(#arr2)"/>
    <text x="628" y="108" font-size="13" font-weight="bold" fill="#374151">① 上盖</text>
    <text x="628" y="126" font-size="11" fill="#6b7280">LED 导光柱 + 麦克风透声孔</text>
    <text x="628" y="142" font-size="11" fill="#6b7280">（内贴防水透声膜）</text>
  </g>

  <!-- ② 防水圈 -->
  <g>
    <rect x="300" y="184" width="200" height="14" rx="7" fill="#93c5fd" stroke="#2563eb" stroke-width="2"/>
    <line x1="500" y1="191" x2="620" y2="191" stroke="#9ca3af" stroke-width="1" marker-end="url(#arr2)"/>
    <text x="628" y="188" font-size="13" font-weight="bold" fill="#374151">② 硅胶防水密封圈</text>
    <text x="628" y="206" font-size="11" fill="#6b7280">整机达到 IPX4 防泼溅</text>
  </g>

  <!-- ③ PCB -->
  <g>
    <rect x="280" y="242" width="240" height="70" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
    <rect x="300" y="256" width="80" height="42" rx="4" fill="#86efac" stroke="#16a34a" stroke-width="1.5"/>
    <text x="340" y="281" text-anchor="middle" font-size="10" fill="#14532d">ESP32-S3</text>
    <rect x="396" y="256" width="34" height="20" rx="3" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.5"/>
    <text x="413" y="270" text-anchor="middle" font-size="8" fill="#14532d">麦克风</text>
    <rect x="396" y="282" width="34" height="18" rx="3" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.5"/>
    <text x="413" y="295" text-anchor="middle" font-size="8" fill="#14532d">IMU</text>
    <rect x="444" y="256" width="56" height="20" rx="3" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.5"/>
    <text x="472" y="270" text-anchor="middle" font-size="8" fill="#14532d">TP4056+C口</text>
    <rect x="444" y="282" width="56" height="18" rx="3" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.5"/>
    <text x="472" y="295" text-anchor="middle" font-size="8" fill="#14532d">LDO+按键</text>
    <line x1="520" y1="277" x2="620" y2="270" stroke="#9ca3af" stroke-width="1" marker-end="url(#arr2)"/>
    <text x="628" y="266" font-size="13" font-weight="bold" fill="#374151">③ PCB 主板（38×28 mm）</text>
    <text x="628" y="284" font-size="11" fill="#6b7280">两层板，元件单面贴装</text>
    <text x="628" y="300" font-size="11" fill="#6b7280">麦克风开孔正对上盖透声孔</text>
  </g>

  <!-- ④ 电池 -->
  <g>
    <rect x="310" y="356" width="180" height="44" rx="8" fill="#fecaca" stroke="#dc2626" stroke-width="2.5"/>
    <text x="400" y="382" text-anchor="middle" font-size="12" fill="#7f1d1d">3.7V 250mAh 锂聚合物</text>
    <line x1="490" y1="378" x2="620" y2="372" stroke="#9ca3af" stroke-width="1" marker-end="url(#arr2)"/>
    <text x="628" y="368" font-size="13" font-weight="bold" fill="#374151">④ 电池（502030，约 5g）</text>
    <text x="628" y="386" font-size="11" fill="#6b7280">带保护板，双面胶固定在下盖</text>
    <text x="628" y="402" font-size="11" fill="#6b7280">与 PCB 之间垫泡棉隔离</text>
  </g>

  <!-- ⑤ 下盖 -->
  <g>
    <path d="M 280 444 L 520 444 L 520 474 Q 400 500 280 474 Z" fill="#e5e7eb" stroke="#374151" stroke-width="2.5"/>
    <!-- 螺丝柱 -->
    <g fill="#9ca3af">
      <circle cx="296" cy="456" r="4"/>
      <circle cx="504" cy="456" r="4"/>
    </g>
    <!-- 穿带槽 -->
    <rect x="330" y="484" width="140" height="12" rx="6" fill="#ffffff" stroke="#374151" stroke-width="2"/>
    <line x1="520" y1="460" x2="620" y2="456" stroke="#9ca3af" stroke-width="1" marker-end="url(#arr2)"/>
    <text x="628" y="452" font-size="13" font-weight="bold" fill="#374151">⑤ 下盖</text>
    <text x="628" y="470" font-size="11" fill="#6b7280">背面弧形贴合猫脖曲线</text>
    <text x="628" y="486" font-size="11" fill="#6b7280">带项圈穿带槽 + 4 个螺丝柱</text>
  </g>

  <!-- ⑥ 项圈 -->
  <g>
    <path d="M 250 560 Q 400 528 550 560" fill="none" stroke="#c4a484" stroke-width="14" stroke-linecap="round"/>
    <rect x="530" y="546" width="24" height="26" rx="6" fill="#8b6f47" stroke="#5c4a30" stroke-width="2"/>
    <line x1="554" y1="558" x2="620" y2="552" stroke="#9ca3af" stroke-width="1" marker-end="url(#arr2)"/>
    <text x="628" y="548" font-size="13" font-weight="bold" fill="#374151">⑥ 猫用安全项圈（10 mm 织带）</text>
    <text x="628" y="566" font-size="11" fill="#6b7280">必须选安全断开扣（breakaway）：</text>
    <text x="628" y="582" font-size="11" fill="#6b7280">猫被树枝/栅栏卡住时项圈自动脱开</text>
  </g>

  <text x="480" y="622" text-anchor="middle" font-size="11" fill="#9ca3af">所有外露边缘做 R2 以上圆角处理，杜绝刮伤；总重目标（主机+项圈）≤ 30 g，适合 3 kg 以上成年猫</text>
</svg>
