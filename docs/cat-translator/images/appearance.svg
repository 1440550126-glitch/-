<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <rect x="0" y="0" width="960" height="560" fill="#ffffff"/>
  <text x="480" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#1f2937">喵语通 MeowTalk · 外观设计图</text>
  <text x="480" y="60" text-anchor="middle" font-size="12" fill="#6b7280">主机尺寸 42 × 32 × 14 mm · 整机重量 ≤ 20 g（含电池，不含项圈）</text>

  <!-- ================= 正视图 ================= -->
  <text x="185" y="100" text-anchor="middle" font-size="15" font-weight="bold" fill="#374151">正视图（朝外一面）</text>

  <!-- 机身 -->
  <rect x="90" y="130" width="190" height="150" rx="28" fill="#f3f4f6" stroke="#374151" stroke-width="2.5"/>
  <!-- LED 状态灯环 -->
  <circle cx="185" cy="175" r="16" fill="none" stroke="#f59e0b" stroke-width="5"/>
  <text x="185" y="179" text-anchor="middle" font-size="9" fill="#92400e">LED</text>
  <!-- 麦克风孔阵列 -->
  <g fill="#374151">
    <circle cx="165" cy="230" r="3"/>
    <circle cx="185" cy="230" r="3"/>
    <circle cx="205" cy="230" r="3"/>
    <circle cx="175" cy="244" r="3"/>
    <circle cx="195" cy="244" r="3"/>
  </g>
  <!-- 尺寸标注：宽 -->
  <g stroke="#2563eb" stroke-width="1" fill="none">
    <line x1="90" y1="300" x2="280" y2="300"/>
    <line x1="90" y1="292" x2="90" y2="308"/>
    <line x1="280" y1="292" x2="280" y2="308"/>
  </g>
  <text x="185" y="318" text-anchor="middle" font-size="12" fill="#2563eb">42 mm</text>
  <!-- 尺寸标注：高 -->
  <g stroke="#2563eb" stroke-width="1" fill="none">
    <line x1="66" y1="130" x2="66" y2="280"/>
    <line x1="58" y1="130" x2="74" y2="130"/>
    <line x1="58" y1="280" x2="74" y2="280"/>
  </g>
  <text x="52" y="210" text-anchor="middle" font-size="12" fill="#2563eb" transform="rotate(-90 52 210)">32 mm</text>

  <!-- 标注引线 -->
  <g stroke="#9ca3af" stroke-width="1">
    <line x1="201" y1="175" x2="300" y2="150"/>
    <line x1="210" y1="237" x2="300" y2="240"/>
  </g>
  <text x="306" y="153" font-size="11" fill="#4b5563">RGB 状态灯（识别中/低电量）</text>
  <text x="306" y="243" font-size="11" fill="#4b5563">麦克风防水透声孔</text>

  <!-- ================= 侧视图 ================= -->
  <text x="185" y="390" text-anchor="middle" font-size="15" font-weight="bold" fill="#374151">侧视图</text>
  <rect x="90" y="415" width="190" height="52" rx="16" fill="#f3f4f6" stroke="#374151" stroke-width="2.5"/>
  <!-- Type-C 口 -->
  <rect x="120" y="435" width="26" height="11" rx="5" fill="#ffffff" stroke="#374151" stroke-width="1.5"/>
  <!-- 按键 -->
  <rect x="225" y="409" width="26" height="8" rx="4" fill="#d1d5db" stroke="#374151" stroke-width="1.5"/>
  <!-- 项圈穿带槽 -->
  <rect x="96" y="474" width="178" height="10" rx="5" fill="#c4a484" stroke="#8b6f47" stroke-width="1.5"/>
  <!-- 厚度标注 -->
  <g stroke="#2563eb" stroke-width="1" fill="none">
    <line x1="292" y1="415" x2="292" y2="467"/>
    <line x1="284" y1="415" x2="300" y2="415"/>
    <line x1="284" y1="467" x2="300" y2="467"/>
  </g>
  <text x="308" y="445" font-size="12" fill="#2563eb">14 mm</text>
  <!-- 标注 -->
  <g stroke="#9ca3af" stroke-width="1">
    <line x1="133" y1="447" x2="110" y2="510"/>
    <line x1="238" y1="409" x2="238" y2="395"/>
    <line x1="185" y1="484" x2="185" y2="510"/>
  </g>
  <text x="60" y="524" font-size="11" fill="#4b5563">Type-C 充电口（硅胶塞防水）</text>
  <text x="243" y="399" font-size="11" fill="#4b5563">电源/配对键</text>
  <text x="192" y="524" font-size="11" fill="#4b5563">项圈穿带槽（10 mm 宽织带）</text>

  <!-- ================= 佩戴示意 ================= -->
  <text x="700" y="100" text-anchor="middle" font-size="15" font-weight="bold" fill="#374151">佩戴示意</text>

  <!-- 猫头（简化剪影） -->
  <g stroke="#374151" stroke-width="2.5" fill="#fde8d7">
    <!-- 耳朵 -->
    <path d="M 615 190 L 600 130 L 655 165 Z"/>
    <path d="M 785 190 L 800 130 L 745 165 Z"/>
    <!-- 头 -->
    <ellipse cx="700" cy="215" rx="95" ry="78"/>
  </g>
  <!-- 脸 -->
  <g fill="#374151">
    <ellipse cx="665" cy="205" rx="7" ry="10"/>
    <ellipse cx="735" cy="205" rx="7" ry="10"/>
    <path d="M 694 238 L 706 238 L 700 247 Z"/>
  </g>
  <g stroke="#374151" stroke-width="1.5" fill="none">
    <path d="M 700 247 Q 690 258 678 253"/>
    <path d="M 700 247 Q 710 258 722 253"/>
    <!-- 胡须 -->
    <line x1="640" y1="230" x2="590" y2="222"/>
    <line x1="642" y1="240" x2="592" y2="240"/>
    <line x1="760" y1="230" x2="810" y2="222"/>
    <line x1="758" y1="240" x2="808" y2="240"/>
  </g>
  <!-- 脖子/身体 -->
  <path d="M 640 280 Q 630 340 625 400 L 775 400 Q 770 340 760 280" fill="#fde8d7" stroke="#374151" stroke-width="2.5"/>
  <!-- 项圈 -->
  <path d="M 632 310 Q 700 345 768 310 L 768 328 Q 700 363 632 328 Z" fill="#c4a484" stroke="#8b6f47" stroke-width="2"/>
  <!-- 安全扣 -->
  <rect x="748" y="308" width="18" height="24" rx="5" fill="#8b6f47" stroke="#5c4a30" stroke-width="1.5"/>
  <!-- 主机挂在项圈上 -->
  <rect x="672" y="332" width="56" height="42" rx="12" fill="#f3f4f6" stroke="#374151" stroke-width="2.5"/>
  <circle cx="700" cy="346" r="6" fill="none" stroke="#f59e0b" stroke-width="3"/>
  <g fill="#374151">
    <circle cx="692" cy="362" r="1.8"/>
    <circle cx="700" cy="362" r="1.8"/>
    <circle cx="708" cy="362" r="1.8"/>
  </g>

  <!-- BLE 信号 -->
  <g stroke="#3b82f6" stroke-width="2" fill="none">
    <path d="M 738 340 Q 752 352 738 364" />
    <path d="M 750 330 Q 772 352 750 374" />
    <path d="M 762 320 Q 792 352 762 384" />
  </g>
  <!-- 手机 -->
  <rect x="820" y="300" width="66" height="120" rx="10" fill="#ffffff" stroke="#374151" stroke-width="2.5"/>
  <rect x="828" y="316" width="50" height="76" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="853" y="342" text-anchor="middle" font-size="9" fill="#1d4ed8">“铲屎的，</text>
  <text x="853" y="356" text-anchor="middle" font-size="9" fill="#1d4ed8">我饿了！”</text>
  <circle cx="853" cy="405" r="6" fill="none" stroke="#374151" stroke-width="1.5"/>
  <text x="853" y="440" text-anchor="middle" font-size="11" fill="#4b5563">手机 App</text>

  <!-- 标注 -->
  <g stroke="#9ca3af" stroke-width="1">
    <line x1="757" y1="320" x2="800" y2="270"/>
    <line x1="672" y1="353" x2="600" y2="400"/>
  </g>
  <text x="804" y="266" font-size="11" fill="#4b5563">安全断开扣</text>
  <text x="806" y="278" font-size="10" fill="#9ca3af">（卡住时自动脱落）</text>
  <text x="530" y="414" font-size="11" fill="#4b5563">主机（麦克风朝下颌方向，</text>
  <text x="530" y="428" font-size="11" fill="#4b5563">离声源最近，拾音最清晰）</text>
  <text x="790" y="460" font-size="11" fill="#3b82f6">BLE 5.0 低功耗蓝牙</text>
</svg>
