<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <rect x="0" y="0" width="960" height="560" fill="#ffffff"/>
  <text x="480" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#1f2937">喵语通 MeowTalk Pro · 外观设计图（实时语音版）</text>
  <text x="480" y="60" text-anchor="middle" font-size="12" fill="#6b7280">主机尺寸 45 × 34 × 16 mm · 整机重量 ≤ 25 g（含电池，不含项圈）· 内置扬声器实时播报</text>

  <!-- ================= 正视图 ================= -->
  <text x="185" y="100" text-anchor="middle" font-size="15" font-weight="bold" fill="#374151">正视图（朝外一面）</text>

  <!-- 机身 -->
  <rect x="88" y="122" width="194" height="160" rx="28" fill="#f3f4f6" stroke="#374151" stroke-width="2.5"/>
  <!-- LED 状态灯环 -->
  <circle cx="185" cy="158" r="14" fill="none" stroke="#f59e0b" stroke-width="5"/>
  <text x="185" y="162" text-anchor="middle" font-size="9" fill="#92400e">LED</text>
  <!-- 麦克风孔阵列 -->
  <g fill="#374151">
    <circle cx="167" cy="196" r="3"/>
    <circle cx="185" cy="196" r="3"/>
    <circle cx="203" cy="196" r="3"/>
  </g>
  <!-- 扬声器出音孔（栅格） -->
  <g stroke="#374151" stroke-width="3" stroke-linecap="round">
    <line x1="145" y1="226" x2="225" y2="226"/>
    <line x1="137" y1="240" x2="233" y2="240"/>
    <line x1="145" y1="254" x2="225" y2="254"/>
  </g>
  <!-- 尺寸标注：宽 -->
  <g stroke="#2563eb" stroke-width="1" fill="none">
    <line x1="88" y1="302" x2="282" y2="302"/>
    <line x1="88" y1="294" x2="88" y2="310"/>
    <line x1="282" y1="294" x2="282" y2="310"/>
  </g>
  <text x="185" y="320" text-anchor="middle" font-size="12" fill="#2563eb">45 mm</text>
  <!-- 尺寸标注：高 -->
  <g stroke="#2563eb" stroke-width="1" fill="none">
    <line x1="64" y1="122" x2="64" y2="282"/>
    <line x1="56" y1="122" x2="72" y2="122"/>
    <line x1="56" y1="282" x2="72" y2="282"/>
  </g>
  <text x="50" y="206" text-anchor="middle" font-size="12" fill="#2563eb" transform="rotate(-90 50 206)">34 mm</text>

  <!-- 标注引线 -->
  <g stroke="#9ca3af" stroke-width="1">
    <line x1="199" y1="158" x2="300" y2="140"/>
    <line x1="208" y1="196" x2="300" y2="196"/>
    <line x1="233" y1="240" x2="300" y2="248"/>
  </g>
  <text x="306" y="143" font-size="11" fill="#4b5563">RGB 状态灯（识别中/低电量）</text>
  <text x="306" y="199" font-size="11" fill="#4b5563">麦克风防水透声孔</text>
  <text x="306" y="251" font-size="11" fill="#4b5563">扬声器出音孔（朝外，背向猫耳；</text>
  <text x="306" y="265" font-size="11" fill="#4b5563">内贴防水透声膜）</text>

  <!-- ================= 侧视图 ================= -->
  <text x="185" y="390" text-anchor="middle" font-size="15" font-weight="bold" fill="#374151">侧视图</text>
  <rect x="88" y="413" width="194" height="56" rx="17" fill="#f3f4f6" stroke="#374151" stroke-width="2.5"/>
  <!-- Type-C 口 -->
  <rect x="118" y="435" width="26" height="11" rx="5" fill="#ffffff" stroke="#374151" stroke-width="1.5"/>
  <!-- 音量/静音拨键 -->
  <rect x="160" y="407" width="34" height="8" rx="4" fill="#93c5fd" stroke="#2563eb" stroke-width="1.5"/>
  <!-- 按键 -->
  <rect x="227" y="407" width="26" height="8" rx="4" fill="#d1d5db" stroke="#374151" stroke-width="1.5"/>
  <!-- 项圈穿带槽 -->
  <rect x="94" y="476" width="182" height="10" rx="5" fill="#c4a484" stroke="#8b6f47" stroke-width="1.5"/>
  <!-- 厚度标注 -->
  <g stroke="#2563eb" stroke-width="1" fill="none">
    <line x1="294" y1="413" x2="294" y2="469"/>
    <line x1="286" y1="413" x2="302" y2="413"/>
    <line x1="286" y1="469" x2="302" y2="469"/>
  </g>
  <text x="310" y="445" font-size="12" fill="#2563eb">16 mm</text>
  <!-- 标注 -->
  <g stroke="#9ca3af" stroke-width="1">
    <line x1="131" y1="447" x2="108" y2="510"/>
    <line x1="177" y1="407" x2="160" y2="392"/>
    <line x1="240" y1="407" x2="248" y2="393"/>
    <line x1="185" y1="486" x2="185" y2="510"/>
  </g>
  <text x="58" y="524" font-size="11" fill="#4b5563">Type-C 充电口（硅胶塞防水）</text>
  <text x="96" y="388" font-size="11" fill="#2563eb">音量三档拨键（大/小/静音）</text>
  <text x="252" y="390" font-size="11" fill="#4b5563">电源/配对键</text>
  <text x="192" y="524" font-size="11" fill="#4b5563">项圈穿带槽（10 mm 织带）</text>

  <!-- ================= 佩戴示意 ================= -->
  <text x="700" y="100" text-anchor="middle" font-size="15" font-weight="bold" fill="#374151">佩戴与实时播报示意</text>

  <!-- 猫头（简化剪影） -->
  <g stroke="#374151" stroke-width="2.5" fill="#fde8d7">
    <path d="M 615 190 L 600 130 L 655 165 Z"/>
    <path d="M 785 190 L 800 130 L 745 165 Z"/>
    <ellipse cx="700" cy="215" rx="95" ry="78"/>
  </g>
  <g fill="#374151">
    <ellipse cx="665" cy="205" rx="7" ry="10"/>
    <ellipse cx="735" cy="205" rx="7" ry="10"/>
    <path d="M 694 238 L 706 238 L 700 247 Z"/>
  </g>
  <g stroke="#374151" stroke-width="1.5" fill="none">
    <path d="M 700 247 Q 690 258 678 253"/>
    <path d="M 700 247 Q 710 258 722 253"/>
    <line x1="640" y1="230" x2="590" y2="222"/>
    <line x1="642" y1="240" x2="592" y2="240"/>
    <line x1="760" y1="230" x2="810" y2="222"/>
    <line x1="758" y1="240" x2="808" y2="240"/>
  </g>
  <!-- 猫叫气泡 -->
  <path d="M 618 178 Q 560 168 556 138 Q 554 116 580 114 Q 578 96 604 98 Q 632 98 634 120 Q 650 126 644 146 Q 640 168 618 178 Z" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="599" y="132" text-anchor="middle" font-size="12" fill="#92400e">喵~喵~</text>
  <text x="599" y="148" text-anchor="middle" font-size="9" fill="#b45309">（猫叫声）</text>

  <!-- 脖子/身体 -->
  <path d="M 640 280 Q 630 340 625 400 L 775 400 Q 770 340 760 280" fill="#fde8d7" stroke="#374151" stroke-width="2.5"/>
  <!-- 项圈 -->
  <path d="M 632 310 Q 700 345 768 310 L 768 328 Q 700 363 632 328 Z" fill="#c4a484" stroke="#8b6f47" stroke-width="2"/>
  <!-- 安全扣 -->
  <rect x="748" y="308" width="18" height="24" rx="5" fill="#8b6f47" stroke="#5c4a30" stroke-width="1.5"/>
  <!-- 主机挂在项圈上 -->
  <rect x="670" y="332" width="60" height="46" rx="12" fill="#f3f4f6" stroke="#374151" stroke-width="2.5"/>
  <circle cx="700" cy="345" r="5" fill="none" stroke="#f59e0b" stroke-width="3"/>
  <g fill="#374151">
    <circle cx="691" cy="357" r="1.6"/>
    <circle cx="700" cy="357" r="1.6"/>
    <circle cx="709" cy="357" r="1.6"/>
  </g>
  <g stroke="#374151" stroke-width="2" stroke-linecap="round">
    <line x1="688" y1="366" x2="712" y2="366"/>
    <line x1="684" y1="372" x2="716" y2="372"/>
  </g>

  <!-- 主机语音气泡（实时播报） -->
  <path d="M 726 388 L 742 402 L 750 388 Z" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <rect x="712" y="404" width="176" height="52" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="800" y="426" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d4ed8">“铲屎的，我饿了！”</text>
  <text x="800" y="444" text-anchor="middle" font-size="10" fill="#3b82f6">主机扬声器实时播报 · 猫叫结束后 ≤0.5 秒</text>

  <!-- 声波 -->
  <g stroke="#2563eb" stroke-width="2" fill="none">
    <path d="M 738 348 Q 750 358 738 368"/>
    <path d="M 748 340 Q 768 358 748 376"/>
  </g>

  <!-- 手机（选配） -->
  <rect x="836" y="150" width="60" height="108" rx="9" fill="#ffffff" stroke="#9ca3af" stroke-width="2" stroke-dasharray="5 4"/>
  <rect x="843" y="164" width="46" height="66" rx="4" fill="#f9fafb" stroke="#e5e7eb"/>
  <text x="866" y="188" text-anchor="middle" font-size="8.5" fill="#6b7280">历史记录</text>
  <text x="866" y="202" text-anchor="middle" font-size="8.5" fill="#6b7280">语音包/纠错</text>
  <circle cx="866" cy="244" r="5" fill="none" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="866" y="276" text-anchor="middle" font-size="10.5" fill="#6b7280">手机 App（选配）</text>
  <text x="866" y="290" text-anchor="middle" font-size="9" fill="#9ca3af">不连手机也能用</text>

  <!-- 标注 -->
  <g stroke="#9ca3af" stroke-width="1">
    <line x1="757" y1="316" x2="806" y2="300"/>
    <line x1="670" y1="352" x2="580" y2="392"/>
  </g>
  <text x="810" y="296" font-size="11" fill="#4b5563">安全断开扣</text>
  <text x="516" y="406" font-size="11" fill="#4b5563">主机（麦克风朝下颌，</text>
  <text x="516" y="420" font-size="11" fill="#4b5563">扬声器朝外背向猫耳）</text>
</svg>
