# LingCraft 子域（可选）：craft.lingmirror.com.cn → 同一后端 3003 的 /craft 站点。
# 追加到 Caddyfile 后 reload。@needsPrefix 保证 /api/* 与已带 /craft 前缀的路径不被二次改写。
craft.lingmirror.com.cn {
	encode zstd gzip
	@needsPrefix not path /api/* /craft/*
	rewrite @needsPrefix /craft{uri}
	reverse_proxy 127.0.0.1:3003 {
		flush_interval -1
	}
}
